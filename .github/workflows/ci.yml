name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm godot.zip

      - name: Import project
        run: ./godot --headless --path . --import

      # GUT skips test scripts that fail to parse without failing the run, so check the log too.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          if grep -E "SCRIPT ERROR|Ignoring script" gut.log; then
            echo "::error::A test script failed to load."
            exit 1
          fi
