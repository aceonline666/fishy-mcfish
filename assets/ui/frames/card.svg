<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Cards in the panels. Drawn in grey so the code can tint them (modulate) to any color:
       mid grey is the card color, white the light rim, dark grey the shade at the bottom. -->
