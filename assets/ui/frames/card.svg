  <rect x="5" y="5" width="86" height="86" rx="25" fill="#9c9c9c"/>
  <rect x="5" y="5" width="86" height="78" rx="25" fill="#cccccc"/>
  <rect x="11" y="11" width="74" height="72" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M 17 33 A 18 18 0 0 1 31 17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
