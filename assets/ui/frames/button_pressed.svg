<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- A comic button, drawn as a nine-patch: ink outline, a darker lip below and a glossy face. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8a83c"/>
      <stop offset="1" stop-color="#e47812"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="30" fill="#12172a"/>
  <rect x="6" y="6" width="84" height="84" rx="24" fill="#b9500c"/>
  <rect x="6" y="12" width="84" height="78" rx="24" fill="url(#face)"/>
  <rect x="16" y="17" width="64" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.45"/>
</svg>
