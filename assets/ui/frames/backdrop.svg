<svg xmlns="http://www.w3.org/2000/svg" width="270" height="480" viewBox="0 0 270 480">
  <!-- Behind the full-screen panels: deep water, lighter at the top, with soft rays of sun. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e4a78"/>
      <stop offset="0.45" stop-color="#082c4d"/>
      <stop offset="1" stop-color="#03111f"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fe4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="270" height="480" fill="url(#water)" fill-opacity="0.97"/>
  <path d="M 40 0 L 70 0 L 20 300 L -20 300 Z" fill="url(#ray)"/>
  <path d="M 120 0 L 140 0 L 130 260 L 95 260 Z" fill="url(#ray)"/>
  <path d="M 190 0 L 230 0 L 290 320 L 240 320 Z" fill="url(#ray)"/>
</svg>
