<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- The chosen one of a group of choices: the comic button pressed in deep, as a nine-patch. The
       face sinks to the bottom (no lip left), a dark inner shadow lies along its top edge, and it has
       no gloss. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a24"/>
      <stop offset="1" stop-color="#d0660c"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2404" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5a2404" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="30" fill="#12172a"/>
  <rect x="6" y="6" width="84" height="84" rx="24" fill="#8a3a06"/>
  <rect x="6" y="16" width="84" height="74" rx="24" fill="url(#face)"/>
  <rect x="6" y="6" width="84" height="26" rx="24" fill="url(#shade)"/>
</svg>
