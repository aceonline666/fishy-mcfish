  </defs>
  <rect x="2.5" y="2.5" width="59" height="35" rx="17.5" fill="url(#fill)" stroke="#12172a" stroke-width="5"/>
  <rect x="12" y="9" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.7"/>
